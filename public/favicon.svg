<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" fill="#FF0000" rx="40"/>

  <!-- Middle-finger symbol (stylized, centered) -->
  <g transform="translate(0,0)">
    <!-- Palm -->
    <rect x="72" y="76" width="56" height="56" rx="12" fill="#000000"/>

    <!-- Middle finger (raised) -->
    <rect x="94" y="18" width="12" height="72" rx="6" fill="#000000"/>

    <!-- Index finger (folded) -->
    <rect x="78" y="96" width="14" height="36" rx="7" fill="#000000" transform="rotate(-18 85 114)"/>

    <!-- Ring finger (folded) -->
    <rect x="108" y="96" width="14" height="36" rx="7" fill="#000000" transform="rotate(18 115 114)"/>

    <!-- Thumb (folded across) -->
    <rect x="58" y="104" width="34" height="14" rx="7" fill="#000000" transform="rotate(-28 75 111)"/>

    <!-- Wrist/base shadow (smaller rounded rect to anchor icon) -->
    <rect x="80" y="126" width="40" height="12" rx="6" fill="#000000"/>

    <!-- Small cutout to create negative-space separation between fingers -->
    <path d="M94 18 q6 14 0 28" fill="#FF0000"/>
  </g>
</svg>
